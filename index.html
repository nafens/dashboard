<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECIS historical data — card filter demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ecl/preset-ec@5.3.0/dist/styles/ecl-ec.css">
<style>
/* ---- demo-only styles; layout and cards are ECL ---- */
:root { --demo-bg: #fff; --demo-muted: #4d4d4d; --demo-panel: #f3f6fc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --demo-bg: #fff; } }
:root[data-theme="dark"] { --demo-bg: #fff; }
html, body { margin: 0; background: var(--demo-bg); font-family: Inter, arial, sans-serif; }
/* match the Drupal oe_theme (ECL 3/4) page container: 1140px incl. 2rem side padding = 1076px content */
.ecl-container.demo-container { width: 1140px; max-width: 100%; padding-inline: 2rem; }
[v-cloak] { display: none; }
.demo-head { margin: 32px 0 20px; }
.demo-head h1 { font-size: 1.75rem; font-weight: 700; line-height: 1.2; margin: 0 0 4px; }
.demo-head p { margin: 0; color: var(--demo-muted); }
/* facets sidebar */
.facets { padding-top: 4px; }
.facet-group { margin-bottom: 20px; }
.facet-title { font-size: .875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--demo-muted); margin: 0 0 8px; }
.facet-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.facet-btn { display: inline-flex !important; align-items: center; gap: 8px; }
.facet-btn .count { font-variant-numeric: tabular-nums; font-size: .75rem; line-height: 1.1; padding: 2px 6px; }
.facet-btn.ecl-button--primary .count { background: rgba(255,255,255,.22); border-color: transparent; color: #fff; }
.facet-btn.is-zero { opacity: .45; }
/* view buttons: recolour the ECL primary/secondary tokens per scenario */
.view-btn.ecl-button--primary { background-color: var(--sc-strong); border-color: var(--sc-strong); color: #fff; }
.view-btn.ecl-button--primary:hover { background-color: color-mix(in srgb, var(--sc-strong) 85%, #000); border-color: transparent; color: #fff; }
.view-btn.ecl-button--primary .count { color: #fff; background: rgba(255,255,255,.22); border-color: transparent; }
.view-btn.ecl-button--secondary { border-color: var(--sc); }
.view-btn.ecl-button--secondary:hover { background-color: color-mix(in srgb, var(--sc) 12%, #fff); border-color: var(--sc); }
.view-btn .swatch { width: 10px; height: 10px; border-radius: 2px; background: var(--sc); }
.view-btn.ecl-button--primary .swatch { background: var(--sc); }
.size-bar { display: flex; align-items: flex-start; gap: 16px; padding: 0 0 16px; margin-bottom: 8px; border-bottom: 1px solid #cfd5dd; }
.size-bar .ecl-form-label { margin: 6px 0 0; }
.size-slider { width: 300px; max-width: 100%; }
.size-name { color: var(--demo-muted); font-size: .875rem; margin: 6px 0 0 auto; }
/* custom range: bordered track, bordered thumb, works in Chromium + Firefox */
.size-range { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; cursor: pointer; }
.size-range::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: #f3f6fc; border: 1px solid #171717; }
.size-range::-moz-range-track          { height: 10px; border-radius: 5px; background: #f3f6fc; border: 1px solid #171717; box-sizing: border-box; }
.size-range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -7px; border-radius: 50%;
  background: #0e47cb; border: 2px solid #fff; box-shadow: 0 0 0 2px #171717; }
.size-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #0e47cb; border: 2px solid #fff; box-shadow: 0 0 0 2px #171717; }
.size-range:focus-visible { outline: none; }
.size-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 2px #171717, 0 0 0 5px #ffd617; }
.size-range:focus-visible::-moz-range-thumb     { box-shadow: 0 0 0 2px #171717, 0 0 0 5px #ffd617; }
.size-ticks { display: flex; justify-content: space-between; margin: 2px 6px 0; }
.size-ticks button { background: none; border: 0; padding: 2px 0; font: inherit; font-size: .75rem; color: var(--demo-muted); cursor: pointer; position: relative; }
.size-ticks button::before { content: ""; display: block; width: 1px; height: 6px; background: #171717; margin: 0 auto 3px; }
.size-ticks button.is-current { color: #0e47cb; font-weight: 600; }
/* grid = ECL grid; each column is the TransitionGroup child */
.cards.ecl-row { position: relative; }
.card-col { margin-bottom: 1rem; }
.card-col .ecl-card { height: 100%; }
.thumb { display: block; aspect-ratio: 3 / 2; width: 100%; background: #f5f7fb; border-bottom: 1px solid #e3e8ef; }
.thumb svg { display: block; width: 100%; height: 100%; }
.scenario-label { background: var(--sc) !important; color: var(--sc-fg) !important; border: 0 !important; }
/* shuffle animation */
.shuffle-move, .shuffle-enter-active { transition: transform .45s cubic-bezier(.22,1,.36,1), opacity .3s ease; }
.shuffle-leave-active { transition: transform .25s ease, opacity .2s ease; position: absolute; }
.shuffle-enter-from, .shuffle-leave-to { opacity: 0; transform: scale(.92); }
@media (prefers-reduced-motion: reduce) { .shuffle-move, .shuffle-enter-active, .shuffle-leave-active { transition: none; } }
.empty { border: 1px dashed #cfd5dd; padding: 40px; text-align: center; color: var(--demo-muted); border-radius: 4px; }
.code-note { margin-top: 32px; padding: 16px 0 48px; border-top: 1px solid #cfd5dd; color: var(--demo-muted); font-size: .875rem; }
.code-note code { font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div id="app" v-cloak class="ecl-container demo-container">
  <header class="demo-head">
    <h1>Data explorer </h1>
    <p>Interactive visualisation of cancer data via ECIS studies.</p>
  </header>

  <div class="ecl-row">
    <aside class="ecl-col-12 ecl-col-l-3 facets">
      <div class="facet-group" role="group" aria-labelledby="f-study">
        <h2 id="f-study" class="facet-title">Study</h2>
        <div class="facet-btns">
          <button v-for="[value, count] in facets.study" :key="value" type="button"
                  class="ecl-button ecl-button--s facet-btn"
                  :class="[selected.study.has(value) ? 'ecl-button--primary' : 'ecl-button--secondary', { 'is-zero': !count && !selected.study.has(value) }]"
                  :aria-pressed="selected.study.has(value)" @click="toggle('study', value)">
            {{ value }}<span class="ecl-label ecl-label--low count">{{ count }}</span>
          </button>
        </div>
      </div>
      <div class="facet-group" role="group" aria-labelledby="f-view">
        <h2 id="f-view" class="facet-title">View</h2>
        <div class="facet-btns">
          <button v-for="[value, count] in facets.view" :key="value" type="button"
                  class="ecl-button ecl-button--s facet-btn view-btn"
                  :class="[selected.view.has(value) ? 'ecl-button--primary' : 'ecl-button--secondary', { 'is-zero': !count && !selected.view.has(value) }]"
                  :style="viewVars(value)"
                  :aria-pressed="selected.view.has(value)" @click="toggle('view', value)">
            <span class="swatch"></span>{{ value }}<span class="ecl-label ecl-label--low count">{{ count }}</span>
          </button>
        </div>
      </div>
      <div class="facet-group" role="group" aria-labelledby="f-type">
        <h2 id="f-type" class="facet-title">Chart type</h2>
        <div class="facet-btns">
          <button v-for="[value, count] in facets.type" :key="value" type="button"
                  class="ecl-button ecl-button--s facet-btn"
                  :class="[selected.type.has(value) ? 'ecl-button--primary' : 'ecl-button--secondary', { 'is-zero': !count && !selected.type.has(value) }]"
                  :aria-pressed="selected.type.has(value)" @click="toggle('type', value)">
            {{ value }}<span class="ecl-label ecl-label--low count">{{ count }}</span>
          </button>
        </div>
      </div>
      <button v-if="activeCount" class="ecl-button ecl-button--ghost ecl-button--s" type="button" @click="clear">Show all</button>
    </aside>

    <main class="ecl-col-12 ecl-col-l-9">
      <div class="size-bar">
        <!-- card size slider — disabled for now, uncomment to bring it back
        <label class="ecl-form-label" for="card-size">Card size</label>
        <div class="size-slider">
          <input id="card-size" class="size-range" type="range" min="0" :max="SIZES.length - 1" step="1" v-model.number="sizeIdx"
                 :aria-valuetext="SIZES[sizeIdx].name" list="size-ticks">
          <div class="size-ticks" aria-hidden="true">
            <button v-for="(s, i) in SIZES" :key="s.name" type="button" :class="{ 'is-current': i === sizeIdx }" @click="sizeIdx = i">{{ s.name }}</button>
          </div>
        </div>
        -->
        <span class="size-name">{{ results.length }} of {{ items.length }} charts</span>
      </div>

      <TransitionGroup tag="div" class="ecl-row cards" name="shuffle" :style="rowStyle">
    <div v-for="r in results" :key="r.id" :class="['ecl-col-12 ecl-col-s-6 card-col', colClass]"
         :style="{ '--sc': VIEWS[r.view].color, '--sc-fg': VIEWS[r.view].fg }">
      <article class="ecl-card">
        <div class="ecl-card__picture thumb" :style="{ '--sc': VIEWS[r.view].color }" v-html="thumb(r.type)" aria-hidden="true"></div>
        <div class="ecl-card__body">
          <div class="ecl-content-block ecl-card__content-block">
            <ul class="ecl-content-block__label-container">
              <li class="ecl-content-block__label-item"><span class="ecl-label ecl-label--medium">{{ r.study }}</span></li>
              <li class="ecl-content-block__label-item"><span class="ecl-label scenario-label">{{ r.scenario }}</span></li>
              <li class="ecl-content-block__label-item"><span class="ecl-label ecl-label--low">{{ r.type }}</span></li>
            </ul>
            <div class="ecl-content-block__title"><a class="ecl-link ecl-link--standalone" href="#" @click.prevent>{{ r.label }}</a></div>
          </div>
        </div>
      </article>
    </div>
  </TransitionGroup>
  <div v-if="!results.length" class="empty">No cards match. <button class="link-btn" type="button" @click="clear">Show all</button></div>

    </main>
  </div>

 </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.38/vue.global.prod.min.js"></script>
<script>
const STUDIES = ['Historical', 'Estimates', 'Long term', 'Childhood', 'Survival', 'Prevalence'];
// color: the scenario colour (swatch, card label, thumbnail)
// strong: a darker shade for the selected button so white text meets contrast
const VIEWS = {
  'By age':      { color: '#FF8F73', strong: '#C2451F', fg: '#171717' },
  'By cancer':   { color: '#2684FF', strong: '#0E47CB', fg: '#fff' },
  'By registry': { color: '#8777D9', strong: '#5B4BB5', fg: '#fff' },
  'By country':  { color: '#8777D9', strong: '#5B4BB5', fg: '#fff' },
  'By year':     { color: '#36B37E', strong: '#1E7A54', fg: '#fff' },
  'By population': { color: '#FFC400', strong: '#8A6400', fg: '#171717' },
};
const TYPES = ['line chart', 'horizontal bar chart', 'data table', 'map', 'pie chart', 'bubble chart', 'big numbers', 'pyramid'];
const raw = [
  // Historical
  ['hist-cc-1',  'Historical', 'By age',      'Age-specific incidence/mortality',                 'line chart'],
  ['hist-pop-1', 'Historical', 'By age',      'Population pyramid',                                'pyramid'],
  ['hist-pop-2', 'Historical', 'By age',      'Population by year (summary)',                      'data table'],
  ['hist-can-1', 'Historical', 'By cancer',   'Incidence/mortality',                               'horizontal bar chart'],
  ['hist-can-2', 'Historical', 'By cancer',   'Incidence/mortality (summary)',                     'data table'],
  ['hist-can-3', 'Historical', 'By cancer',   'Age-specific incidence/mortality (summary)',        'data table'],
  ['hist-cou-1', 'Historical', 'By registry', 'Incidence/mortality (map)',                         'map'],
  ['hist-cou-2', 'Historical', 'By registry', 'Incidence/mortality',                               'horizontal bar chart'],
  ['hist-cou-3', 'Historical', 'By registry', 'Incidence/mortality (summary)',                     'data table'],
  ['hist-pop-3', 'Historical', 'By registry', 'Population by age (summary)',                       'data table'],
  ['hist-cc-3',  'Historical', 'By year',     'Incidence/mortality trends',                        'line chart'],
  ['hist-cc-2',  'Historical', 'By year',     'Incidence/mortality trends by age',                 'line chart'],
  ['hist-cc-4',  'Historical', 'By year',     'Incidence/mortality trends by age-period-cohort',   'line chart'],
  ['hist-cc-5',  'Historical', 'By year',     'Incidence/mortality (summary)',                     'data table'],
  // Estimates
  ['est-can-1',  'Estimates',  'By cancer',   'Incidence/mortality (at a glance)',                 'big numbers'],
  ['est-can-2',  'Estimates',  'By cancer',   'Incidence/mortality (percentage distribution)',     'pie chart'],
  ['est-can-3',  'Estimates',  'By cancer',   'Incidence/mortality by age',                        'horizontal bar chart'],
  ['est-can-4',  'Estimates',  'By cancer',   'Incidence/mortality by sex',                        'horizontal bar chart'],
  ['est-can-5',  'Estimates',  'By cancer',   'Incidence/mortality (comparison with a reference country)', 'horizontal bar chart'],
  ['est-can-6',  'Estimates',  'By cancer',   'Incidence/mortality (summary)',                     'data table'],
  ['est-can-7',  'Estimates',  'By cancer',   'Incidence/mortality',                               'horizontal bar chart'],
  ['est-cou-0',  'Estimates',  'By country',  'Incidence/mortality (map)',                         'map'],
  ['est-cou-1',  'Estimates',  'By country',  'Incidence/mortality',                               'horizontal bar chart'],
  ['est-cou-2',  'Estimates',  'By country',  'Incidence/mortality by sex',                        'horizontal bar chart'],
  ['est-cou-3',  'Estimates',  'By country',  'Incidence/mortality (comparison with a reference country)', 'horizontal bar chart'],
  ['est-cou-4',  'Estimates',  'By country',  'Incidence/mortality (summary)',                     'data table'],
  // Long term (projections)
  ['long-can-1', 'Long term',  'By cancer',     'Incidence/mortality (at a glance)',                 'big numbers'],
  ['long-can-2', 'Long term',  'By cancer',     'Incidence/mortality by age',                        'horizontal bar chart'],
  ['long-can-3', 'Long term',  'By cancer',     'Incidence/mortality',                               'bubble chart'],
  ['long-can-4', 'Long term',  'By cancer',     'Relative change in incidence/mortality',            'horizontal bar chart'],
  ['long-can-5', 'Long term',  'By cancer',     'Incidence/mortality (summary)',                     'data table'],
  ['long-cou-1', 'Long term',  'By country',    'Relative change in incidence/mortality (map)',      'map'],
  ['long-cou-2', 'Long term',  'By country',    'Incidence/mortality',                               'bubble chart'],
  ['long-cou-3', 'Long term',  'By country',    'Relative change in incidence/mortality',            'horizontal bar chart'],
  ['long-cou-4', 'Long term',  'By country',    'Incidence/mortality (summary)',                     'data table'],
  ['long-yea-1', 'Long term',  'By year',       'Incidence/mortality trends',                        'line chart'],
  ['long-yea-2', 'Long term',  'By year',       'Relative change in incidence/mortality',            'horizontal bar chart'],
  ['long-yea-3', 'Long term',  'By year',       'Incidence/mortality (summary)',                     'data table'],
  ['long-pop-1', 'Long term',  'By population', 'Relative change in incidence/mortality by age',     'horizontal bar chart'],
  ['long-pop-2', 'Long term',  'By population', 'Relative change in incidence/mortality',            'horizontal bar chart'],
  ['long-pop-3', 'Long term',  'By population', 'Incidence/mortality (summary)',                     'data table'],
  // Childhood
  ['chil-cc-1',  'Childhood',  'By age',      'Age-specific incidence',                            'line chart'],
  ['chil-can-1', 'Childhood',  'By cancer',   'Incidence (percentage distribution)',               'pie chart'],
  ['chil-can-2', 'Childhood',  'By cancer',   'Age-specific incidence (summary)',                  'data table'],
  ['chil-can-3', 'Childhood',  'By cancer',   'Incidence (summary)',                               'data table'],
  ['chil-cou-1', 'Childhood',  'By registry', 'Incidence',                                         'horizontal bar chart'],
  ['chil-cou-2', 'Childhood',  'By registry', 'Incidence (summary)',                               'data table'],
  ['chil-cc-2',  'Childhood',  'By year',     'Incidence trends',                                  'line chart'],
  // Survival
  ['surv-cc-1',  'Survival',   'By age',      'Age-specific 5-year relative survival',             'line chart'],
  ['surv-cou-1', 'Survival',   'By country',  'Age-standardised 5-year relative survival by country', 'horizontal bar chart'],
  ['surv-cou-2', 'Survival',   'By country',  'Age-standardised relative survival by country and follow-up interval', 'data table'],
  ['surv-cc-2',  'Survival',   'By year',     'Relative survival by follow-up interval',           'line chart'],
  ['surv-cc-3',  'Survival',   'By year',     'Observed and relative survival (summary)',          'data table'],
  // Prevalence
  ['prev-cc-1',  'Prevalence', 'By age',      'Age-specific prevalence estimates',                 'line chart'],
  ['prev-can-1', 'Prevalence', 'By cancer',   'Prevalence estimates by cancer at a glance',        'big numbers'],
  ['prev-can-2', 'Prevalence', 'By cancer',   'Prevalence estimates by cancer (percent distribution)', 'pie chart'],
  ['prev-can-3', 'Prevalence', 'By cancer',   'Prevalence estimates by cancer',                    'horizontal bar chart'],
  ['prev-can-4', 'Prevalence', 'By cancer',   'Prevalence estimates by cancer (comparison by sex)', 'horizontal bar chart'],
  ['prev-can-5', 'Prevalence', 'By cancer',   'Prevalence estimates by cancer (difference with EU27)', 'horizontal bar chart'],
  ['prev-can-6', 'Prevalence', 'By cancer',   'Prevalence estimates by cancer (summary)',          'data table'],
  ['prev-cou-0', 'Prevalence', 'By country',  'Prevalence estimates by country (map)',             'map'],
  ['prev-cou-1', 'Prevalence', 'By country',  'Prevalence estimates by country',                   'horizontal bar chart'],
  ['prev-cou-2', 'Prevalence', 'By country',  'Prevalence estimates by country (comparison by sex)', 'horizontal bar chart'],
  ['prev-cou-3', 'Prevalence', 'By country',  'Prevalence estimates by country (summary)',         'data table'],
  ['prev-cc-2',  'Prevalence', 'By year',     'Age-specific prevalence by years from diagnosis',   'line chart'],
  ['prev-cc-3',  'Prevalence', 'By year',     'Prevalence by years from diagnosis (trends)',       'horizontal bar chart'],
  ['prev-cc-4',  'Prevalence', 'By year',     'Prevalence by age and years from diagnosis (summary)', 'data table'],
];
// list studies/views in a fixed order by seeding counts from STUDIES / VIEWS keys
const items = raw.map(([id, study, scenario, label, type]) => ({ id, study, scenario, view: scenario, label, type }));

const { createApp, ref, reactive, computed } = Vue;

// slider steps: how many cards per row on large screens. Zoom is relative to the
// 4-column layout (zoom 1 = ECL's normal card size), so everything inside a card
// scales together - image, label, title, description, spacing.
// cards live in the 9-column content area; zoom 1 = 3 cards per row there
const SIZES = [
  { name: 'X-small', cols: 6 },
  { name: 'Small',   cols: 4 },
  { name: 'Medium',  cols: 3 },
  { name: 'Large',   cols: 2 },
  { name: 'X-large', cols: 1 },
];

function useFacets(items, facetKeys) {
  const selected = reactive(Object.fromEntries(facetKeys.map(k => [k, new Set()])));
  const passes = (item, except) =>
    facetKeys.every(k => k === except || selected[k].size === 0 || selected[k].has(String(item[k])));
  const results = computed(() => items.filter(i => passes(i)));
  const facets = computed(() => Object.fromEntries(facetKeys.map(k => {
    const counts = new Map();
    (k === 'study' ? STUDIES : k === 'view' ? Object.keys(VIEWS) : k === 'type' ? TYPES : []).forEach(v => counts.set(v, 0));
    for (const i of items) {
      const v = String(i[k]);
      if (!counts.has(v)) counts.set(v, 0);
      if (passes(i, k)) counts.set(v, counts.get(v) + 1);
    }
    return [k, [...counts]];               // insertion order = order in items
  })));
  const toggle = (k, v) => selected[k].has(v) ? selected[k].delete(v) : selected[k].add(v);
  const clear = () => facetKeys.forEach(k => selected[k].clear());
  return { selected, results, facets, toggle, clear };
}

// SVG thumbnails: one per chart type, drawn in the card's view colour (var(--sc))
const THUMBS = {
  'line chart': `
    <g stroke="#d5dbe5" stroke-width="1"><line x1="34" y1="30" x2="34" y2="160"/><line x1="34" y1="160" x2="280" y2="160"/>
      <line x1="34" y1="62" x2="280" y2="62" stroke-dasharray="2 4"/><line x1="34" y1="95" x2="280" y2="95" stroke-dasharray="2 4"/><line x1="34" y1="128" x2="280" y2="128" stroke-dasharray="2 4"/></g>
    <polyline points="34,140 75,122 116,128 157,96 198,84 239,60 280,48" fill="none" stroke="var(--sc)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="34,150 75,146 116,138 157,132 198,118 239,112 280,100" fill="none" stroke="var(--sc)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity=".45"/>
    <g fill="#fff" stroke="var(--sc)" stroke-width="2.5"><circle cx="75" cy="122" r="3.5"/><circle cx="157" cy="96" r="3.5"/><circle cx="239" cy="60" r="3.5"/><circle cx="280" cy="48" r="3.5"/></g>
    <g fill="#9aa5b5" font-size="9" font-family="Inter,Arial"><text x="30" y="176">2000</text><text x="145" y="176">2010</text><text x="262" y="176">2020</text></g>`,
  'horizontal bar chart': `
    <g fill="#c7cfdb" font-size="9" font-family="Inter,Arial" text-anchor="end"><text x="78" y="50">Breast</text><text x="78" y="78">Prostate</text><text x="78" y="106">Colorectal</text><text x="78" y="134">Lung</text><text x="78" y="162">Bladder</text></g>
    <line x1="86" y1="30" x2="86" y2="170" stroke="#d5dbe5"/>
    <g fill="var(--sc)" rx="2"><rect x="86" y="40" width="190" height="14" rx="2"/><rect x="86" y="68" width="152" height="14" rx="2"/><rect x="86" y="96" width="128" height="14" rx="2"/><rect x="86" y="124" width="104" height="14" rx="2"/><rect x="86" y="152" width="58" height="14" rx="2"/></g>
    <g fill="var(--sc)" opacity=".35"><rect x="86" y="55" width="150" height="6" rx="1"/><rect x="86" y="83" width="20" height="6" rx="1"/><rect x="86" y="111" width="112" height="6" rx="1"/><rect x="86" y="139" width="70" height="6" rx="1"/><rect x="86" y="167" width="18" height="6" rx="1"/></g>`,
  'data table': `

  setup() {
    const f = useFacets(items, ['study', 'view', 'type']);
    const activeCount = computed(() => f.selected.study.size + f.selected.view.size + f.selected.type.size);
        const sizeIdx = ref(1);                                   // default: Small (4 per row)
    const colClass = computed(() => 'ecl-col-l-' + (12 / SIZES[sizeIdx.value].cols));
    const rowStyle = computed(() => {
      const zoom = 3 / SIZES[sizeIdx.value].cols;             // 6 cols -> .5, 1 col -> 3
      // percentage widths inside a zoomed box already resolve against the
      // un-zoomed parent, so no width compensation is needed
      return { zoom };
    });
    const viewVars = v => ({ '--sc': VIEWS[v].color, '--sc-strong': VIEWS[v].strong, '--sc-fg': VIEWS[v].fg });
    return { items, VIEWS, activeCount, thumb, viewVars, SIZES, sizeIdx, colClass, rowStyle, ...f };
  }
}).mount('#app');
